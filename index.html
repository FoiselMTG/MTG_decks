<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floris' Commander-Decks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Deck-Auswahl (Dropdown) oben, Commander als eigene Bühne, darunter Liste nach Kartentyp mit fester Vorschau rechts */
:root{
  color-scheme: dark;
  --bg:#12141c;          /* Spieltisch, tintenblau */
  --surface:#1b1e29;     /* Binder-Seite */
  --surface-2:#242836;
  --line:#33384a;
  --fg:#e9e6dc;          /* Kartenpapier */
  --muted:#9a9aa6;
  --gold:#d6b46a;        /* Foil-Akzent */
  --ok:#6fc28b;
  --bad:#f0716b;
  --deck:#d6b46a;        /* wird pro Deck überschrieben */
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 48px}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1880px;margin:0 auto}

/* Kopf */
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-block:28px 12px}
header.top h1{font:800 clamp(1.6rem,3.5vw,2.3rem)/1.1 var(--f-display);margin:0;letter-spacing:.01em}
header.top p{margin:0;color:var(--muted);font-size:.95rem}
nav.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:8px 20px;border-bottom:1px solid var(--line)}
.dd{position:relative;flex:0 1 520px;min-width:0}
.dd-btn{width:100%;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--deck);border-radius:10px;padding:9px 14px;cursor:pointer;text-align:left}
.dd-btn:hover{border-color:var(--muted);border-left-color:var(--deck)}
.dd-txt{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
.dd-txt b{font:700 1.15rem var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-txt small{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-count{font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.chev{color:var(--muted);transition:transform .15s}
.dd-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd-panel{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.55);padding:8px}
.dd-panel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:8px 10px;font:inherit;margin-bottom:6px}
.dd-list{max-height:min(60vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.dd-opt{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.dd-opt:hover,.dd-opt.active{background:var(--surface-2)}
.dd-opt[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--gold)}
.dd-opt .dot{width:10px;height:10px;border-radius:50%;flex:none}
.dd-opt span.t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.dd-opt span.t b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-opt span.t small{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-empty{color:var(--muted);padding:8px 10px;font-size:.9rem}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:1.2rem;color:var(--muted)}
.step:hover{color:var(--fg);border-color:var(--muted)}
.btn.add{border-style:dashed;padding-block:10px}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.ms{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em}
.ms-txt{font:600 .7rem var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:0 4px}

/* Commander-Bühne */
.stage{position:relative;margin-top:24px;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.stage-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:.28;filter:saturate(1.1) blur(1px)}
.stage-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 30%,transparent 100%)}
.stage-inner{position:relative;display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:32px;padding:32px}
.cmd-card{border-radius:4.75%/3.5%;box-shadow:0 18px 40px rgba(0,0,0,.55);cursor:zoom-in;aspect-ratio:488/680;width:100%;background:var(--surface-2);object-fit:cover}
.cmd-info{min-width:0;display:flex;flex-direction:column;gap:12px}
.eyebrow{font:600 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--deck)}
.cmd-info h2{font:800 clamp(1.7rem,4vw,2.8rem)/1.05 var(--f-display);margin:0;text-wrap:balance}
.cmd-type{color:var(--muted);margin:0}
.oracle{white-space:pre-line;max-width:62ch;margin:0;color:var(--fg);opacity:.92}
.deck-note{max-width:62ch;margin:0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:6px;padding:6px 10px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.chip b{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.chip.ok b{color:var(--ok)}
.chip.bad{border-color:var(--bad)}
.chip.bad b{color:var(--bad)}
.partner{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}

/* Kurve */
.curve{display:flex;align-items:flex-end;gap:6px;height:84px;padding-top:4px}
.bar{flex:1 1 0;min-width:18px;max-width:38px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.bar span.n{font:600 .7rem var(--f-mono);color:var(--muted)}
.bar i{display:block;width:100%;background:var(--deck);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bar span.l{font:600 .7rem var(--f-mono);color:var(--muted)}

/* Hauptbereich */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:28px 0 12px}
.toolbar h3{font:700 1.3rem var(--f-display);margin:0}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.size{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}
.size input{accent-color:var(--gold);width:140px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.groups{columns:2 300px;column-gap:28px}
.group{break-inside:avoid;margin-bottom:22px}
.group h4{font:700 1.05rem var(--f-display);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.group h4 small{font:500 .8rem var(--f-mono);color:var(--muted)}
.row{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;border-radius:5px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.row:hover,.row:focus-visible{background:var(--surface-2)}
.row .q{font:500 .78rem var(--f-mono);color:var(--muted)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.off .nm{color:var(--bad)}
.row.off .nm::after{content:" ⚠";}
.row.missing .nm{color:var(--muted);font-style:italic}
.cost{display:inline-flex;gap:1px;white-space:nowrap}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.preview img{border-radius:4.75%/3.5%;box-shadow:0 12px 30px rgba(0,0,0,.5);aspect-ratio:488/680;width:100%;object-fit:cover;background:var(--surface-2)}
.preview p{color:var(--muted);font-size:.85rem;margin:8px 0 0}
.grid{--card:230px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--card),45%),1fr));gap:16px}
.grid figure{margin:0;position:relative}
.grid img{border-radius:4.75%/3.5%;cursor:zoom-in;aspect-ratio:488/680;width:100%;object-fit:cover;background:var(--surface-2);display:block}
.grid .badge{position:absolute;top:6px;left:6px;background:var(--bg);border-radius:4px;font:600 .72rem var(--f-mono);padding:1px 5px}
.grid .warn{outline:3px solid var(--bad);outline-offset:-3px;border-radius:4.75%/3.5%}
.grid .badge.ban{top:auto;bottom:6px;left:6px;right:6px;text-align:center;background:var(--bad);color:#1a0806}
.grid .ph{aspect-ratio:488/680;width:100%;border:1px dashed var(--line);border-radius:4.75%/3.5%;background:var(--surface-2);cursor:pointer;padding:10px;font:700 .95rem var(--f-display)}
.legal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.lg{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:.88rem}
.lg b{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lg.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.lg.ok b{color:var(--ok)}
.lg.no{color:var(--muted)}
.lg.warn{background:color-mix(in srgb,var(--gold) 14%,transparent);border-color:var(--gold)}
.lg.warn b{color:var(--gold)}
.lg.ban{background:color-mix(in srgb,var(--bad) 14%,transparent);border-color:var(--bad)}
.lg.ban b{color:var(--bad)}
.grid-group{grid-column:1/-1;font:700 1.05rem var(--f-display);border-bottom:1px solid var(--line);padding:10px 0 4px}

.planned{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.planned h3{font:700 1.15rem var(--f-display);margin:0 0 8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font:600 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td button.link{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline dotted;cursor:pointer;text-align:left}

.alert{margin-top:16px;border:1px solid var(--bad);border-radius:8px;padding:10px 14px;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.alert ul{margin:6px 0 0;padding-left:20px}
.status{color:var(--muted);font-size:.9rem;margin-top:14px}

/* Dialoge */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.82);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:10;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:1240px;width:100%;margin-block:24px;padding:22px;position:relative}
.close{position:absolute;top:10px;right:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.detail{display:grid;grid-template-columns:minmax(220px,400px) minmax(0,1fr);gap:28px}
.detail img.big{border-radius:4.75%/3.5%;aspect-ratio:488/680;width:100%;object-fit:cover;background:var(--surface-2)}
.detail h3{font:800 1.6rem/1.15 var(--f-display);margin:0 0 4px;padding-right:40px}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;text-decoration:none;color:var(--fg);display:inline-block}
.btn.primary{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.arts button{background:none;border:2px solid transparent;border-radius:8px;padding:0;cursor:pointer;text-align:left}
.arts button[aria-pressed="true"]{border-color:var(--gold)}
.arts img{border-radius:6px;display:block;aspect-ratio:488/680;width:100%;object-fit:cover}
.arts span{display:block;font:500 .68rem var(--f-mono);color:var(--muted);padding:3px 2px}
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit}
textarea{font:.85rem/1.4 var(--f-mono);min-height:240px}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.exp-opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:10px 0}
.exp-opts label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}


/* Powerlevel */
.power{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;align-items:stretch}
.pw-box{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:10px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px;gap:2px}
.pw-lbl{font:600 .66rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pw-num{font:800 2.4rem/1 var(--f-display);color:var(--deck);font-variant-numeric:tabular-nums}
.pw-num i{font:500 .9rem var(--f-mono);color:var(--muted);font-style:normal}
.pw-box small{color:var(--muted);font-size:.85rem}
.meter{width:100%;height:6px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--deck)}
.pw-why{min-width:0;font-size:.92rem;color:var(--muted);display:flex;flex-direction:column;gap:8px;justify-content:center}
.pw-why p{margin:0;max-width:62ch}
.gcs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gcs .lbl{font:600 .66rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;margin-right:4px}
.gc-tag{font:600 .74rem var(--f-mono);border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);color:var(--gold);border-radius:4px;padding:1px 6px;background:transparent;cursor:pointer}
.gc-tag:hover{background:color-mix(in srgb,var(--gold) 15%,transparent)}
.gcs.over .lbl{color:var(--bad)}
.grid .badge.gc{left:auto;right:6px;background:var(--gold);color:#1b1608}
.row .gcm{font:600 .62rem var(--f-mono);color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:0 3px;margin-left:6px;vertical-align:1px}
.dd-br{font:600 .7rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.btn.cmp{padding-block:10px}
/* Vergleich */
.cmp-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:baseline;padding-right:40px}
.cmp-head h3{font:800 1.5rem var(--f-display);margin:0}
.brk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:14px 0 18px}
.brk div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--muted)}
.brk b{display:block;color:var(--fg);font:700 1rem var(--f-display)}
.bp{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;font:700 .8rem var(--f-mono);border-radius:5px;padding:2px 7px;color:#14161e;background:var(--bc)}
.b1{--bc:#8fc7a0}.b2{--bc:#6fc28b}.b3{--bc:#d6b46a}.b4{--bc:#e58b52}.b5{--bc:#f0716b}
.cmp table td{vertical-align:middle}
.cmp tbody tr{cursor:pointer}
.cmp tbody tr:hover td,.cmp tbody tr:focus-visible td{background:var(--surface-2)}
.cmp .dn{display:flex;gap:10px;align-items:center;min-width:0}
.cmp .dn .dot{width:10px;height:10px;border-radius:50%;flex:none}
.cmp .dn b{font:700 1rem var(--f-display);display:block;line-height:1.2}
.cmp .dn small{color:var(--muted);display:block;line-height:1.2}
.plbar{display:flex;align-items:center;gap:8px;min-width:150px}
.plbar .tr{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.plbar .tr i{display:block;height:100%;border-radius:4px}
.plbar b{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums;width:2ch;text-align:right}
.num{font:600 .9rem var(--f-mono);font-variant-numeric:tabular-nums}
.cmp-note{color:var(--muted);font-size:.85rem;margin:12px 0 0;max-width:80ch}

@media (max-width:820px){
  .stage-inner{grid-template-columns:1fr;padding:20px}
  .cmd-card{max-width:260px}
  .main{grid-template-columns:1fr}
  .preview{display:none}
  .detail{grid-template-columns:1fr}
  .detail img.big{max-width:300px}
}
@media (max-width:560px){
  .dd{flex:1 1 calc(100% - 100px)}
  .dd-count{display:none}
  .btn.add,.btn.cmp{flex:1 1 auto}
  .power{grid-template-columns:1fr 1fr}
  .pw-why{grid-column:1/-1}
  .cmp .hide-s{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .row,.tab{transition:background .12s,color .12s}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Floris' Commander-Decks</h1>
    <p>Kartendaten und Artworks live von Scryfall · Brackets nach dem offiziellen Commander-System</p>
  </header>
  <nav class="picker" id="tabs" aria-label="Deck wählen"></nav>
  <main id="deck"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<script>
/* ======================================================================
   WICHTIG FÜR ÄNDERUNGEN: Die Website liegt auf GitHub im Repository
   FoiselMTG/MTG_decks als index.html (https://foiselmtg.github.io/MTG_decks/).
   Immer von der aktuellen Version dort ausgehen; die Projektdatei
   claude/deck-galerie.html wird als Kopie mitgeführt. Der Knopf «Liste exportieren»
   (exportBtn / openExport / buildExport) und alle bestehenden Decks
   müssen nach jeder Änderung erhalten bleiben.
   ====================================================================== */
/* ======================================================================
   DECKS – hier kannst du Listen anpassen. Format wie Arena/Moxfield-Export:
   "1 Kartenname" pro Zeile, Set-Code in Klammern wird ignoriert.
   ====================================================================== */
const DECKS = [
{

  name:"Tricky Terrain",
  commander:"Omo, Queen of Vesuva",
  accent:"#4fb3a4",
  note:"Modern-Horizons-3-Precon. Simic-Länderdeck mit Landfall, Dark Depths + Thespian's Stage und Tron. Upgrades für Länder-Drops, Landfall und Schutz sind vorgeschlagen, aber noch nicht eingebaut.",
  list:`1 Jyoti, Moag Ancient
1 March from Velis Vel

1 Copy Land

1 Trenchpost
1 Sage of the Maze
1 Lazotep Quarry
1 Rampant Frogantua
1 Sunken Palace
1 Horizon of Progress
1 Planar Nexus
1 Aggressive Biomancy
1 Talon Gates of Madara
1 Hydroid Krasis
1 Terastodon
1 Lair of the Hydra
1 Nissa, Steward of Elements
1 Magus of the Candelabra
1 Lumbering Falls
1 Blast Zone
1 Apex Devastator
1 Dreamroot Cascade
1 Summary Dismissal
1 Yavimaya Coast
1 Flooded Grove
1 Hour of Promise
1 Ramunap Excavator
1 Hydra Broodmaster
1 Drown in Dreams
1 Vineglimmer Snarl
1 Vivien Reid
1 Yavimaya, Cradle of Growth
1 Dryad of the Ilysian Grove
1 Mirage Mirror
1 Overflowing Basin
1 Temple of Mystery
1 Chromatic Lantern
1 Oblivion Stone
1 Scute Swarm
1 Ulvenwald Hydra
1 Evacuation
1 Replication Technique

const API = "https://api.scryfall.com";
const SYM = s => `https://svgs.scryfall.io/card-symbols/${s.replace(/\//g,"")}.svg`;
const COLORS = ["W","U","B","R","G"];
const store = {
  get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const cardCache = new Map(Object.entries(store.get("mtg-cards-v2",{})));
let artChoice = store.get("mtg-art",{});        // "deckId|kartenname" -> {normal, art_crop, set, cn}
const artKey = name => current+"|"+key(name);
let customDecks = store.get("mtg-custom",[]);
let viewMode = store.get("mtg-view-v2","grid");
let cardSize = store.get("mtg-size",230);

/* Formate in der Reihenfolge, die für dich am wichtigsten ist */
const FORMATS=[
  ["commander","Commander"],["brawl","Brawl (Arena)"],["standardbrawl","Standard Brawl"],["oathbreaker","Oathbreaker"],
  ["paupercommander","Pauper Commander"],["predh","PreDH"],["duel","Duel Commander"],
  ["standard","Standard"],["pioneer","Pioneer"],["modern","Modern"],["legacy","Legacy"],["vintage","Vintage"],
  ["pauper","Pauper"],["premodern","Premodern"],["oldschool","Old School"],
  ["historic","Historic (Arena)"],["timeless","Timeless (Arena)"],["explorer","Explorer (Arena)"],["alchemy","Alchemy (Arena)"],
  ["gladiator","Gladiator"],["penny","Penny Dreadful"],["future","Future Standard"]
];
const LEGAL={legal:["Legal","ok"],not_legal:["Nicht legal","no"],restricted:["Restricted","warn"],banned:["Gebannt","ban"]};
function legalHTML(c){
  const L=c.legal||{};
  const rows=FORMATS;
  if(!rows.length) return `<p class="hint">Keine Angaben zur Legalität vorhanden.</p>`;
  return `<div class="legal">${rows.map(([k,n])=>{const [t,cls]=LEGAL[L[k]||"not_legal"]||[L[k],"no"];
    return `<div class="lg ${cls}"><span>${esc(n)}</span><b>${esc(t)}</b></div>`}).join("")}</div>`;
}
let current = store.get("mtg-tab","omo");

const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = n => n.toLowerCase().trim();
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const allDecks = () => DECKS.concat(customDecks);

function parseList(txt){
  const out=[];
  for(let line of txt.split(/\r?\n/)){
    line=line.trim();
    if(!line||/^(deck|commander|sideboard|companion)$/i.test(line)) continue;
    const m=line.match(/^(\d+)x?\s+(.+?)(?:\s+\([A-Za-z0-9]+\)\s*[\w-]*)?(?:\s+\*F\*)?$/);
    if(m) out.push({qty:+m[1],name:m[2].trim()});
    else out.push({qty:1,name:line});
  }
  return out;
}

/* ---------- Scryfall ---------- */
function slim(c){
  const f0 = c.card_faces ? c.card_faces[0] : c;
  const img = c.image_uris || (c.card_faces && c.card_faces[0].image_uris) || {};
  const back = c.card_faces && c.card_faces[1] && c.card_faces[1].image_uris ? c.card_faces[1].image_uris.normal : null;
  const oracle = c.card_faces ? c.card_faces.map(f=>`${f.name}\n${f.oracle_text||""}`).join("\n\n") : (c.oracle_text||"");
  return {
    name:c.name, front:f0.name||c.name,
    mana_cost: c.mana_cost || (c.card_faces? c.card_faces.map(f=>f.mana_cost).filter(Boolean).join(" // ") : ""),
    front_cost: c.mana_cost && !c.card_faces ? c.mana_cost : (f0.mana_cost||c.mana_cost||""),
    cmc:c.cmc||0, type_line:f0.type_line||c.type_line||"", full_type:c.type_line||"",
    color_identity:c.color_identity||[], oracle,
    normal:img.normal||"", art_crop:img.art_crop||"", back,
    uri:c.scryfall_uri, oracle_id:c.oracle_id, set:c.set, cn:c.collector_number,
    legal:Object.fromEntries(Object.entries(c.legalities||{}).filter(([k,v])=>v!=="not_legal")), gc:typeof c.game_changer==="boolean"?c.game_changer:undefined, t:Date.now()
  };
}
function saveCache(){
  const o={}; cardCache.forEach((v,k)=>{if(!o[k]||k===key(v.name))o[k]=v}); store.set("mtg-cards-v2",o);
}
/* Scryfall verträgt nur wenige Anfragen pro Sekunde. Darum: langsam laden,
   bei Fehlern warten und nochmals versuchen, nie den ganzen Ladevorgang abbrechen,
   und nach jedem Paket speichern, damit beim nächsten Öffnen nichts verloren ist. */
async function fetchCards(names, onProgress, onChunk){
  const WEEK=7*864e5;
  const need=[...new Set(names)].filter(n=>{const c=cardCache.get(key(n));return !c||Date.now()-c.t>WEEK});
  let done=0, failed=0;
  for(let i=0;i<need.length;i+=75){
    const chunk=need.slice(i,i+75);
    let ok=false;
    for(let attempt=0;attempt<4&&!ok;attempt++){
      try{
        const r=await fetch(API+"/cards/collection",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
          body:JSON.stringify({identifiers:chunk.map(name=>({name}))})});
        if(!r.ok){await sleep(1500*(attempt+1));continue;}
        const j=await r.json();
        for(const c of (j.data||[])){
          const s=slim(c);
          cardCache.set(key(c.name),s);
          if(c.card_faces) cardCache.set(key(c.card_faces[0].name),s);
        }
        // Einzeln nachsuchen, was die Sammelsuche nicht gefunden hat
        for(const nf of (j.not_found||[])){
          for(let t=0;t<3;t++){
            await sleep(250);
            try{
              const r2=await fetch(API+"/cards/named?fuzzy="+encodeURIComponent(nf.name));
              if(r2.ok){const c=await r2.json();const s=slim(c);cardCache.set(key(nf.name),s);cardCache.set(key(c.name),s);break;}
              if(r2.status===404){cardCache.set(key(nf.name),{missing:true,name:nf.name,t:Date.now()-WEEK+36e5});break;}
              await sleep(1500*(t+1));
            }catch(e){await sleep(1500*(t+1));}
          }
        }
        ok=true;
      }catch(e){await sleep(1500*(attempt+1));}
    }
    if(!ok) failed+=chunk.length;
    done+=chunk.length; onProgress&&onProgress(done,need.length);
    saveCache(); onChunk&&onChunk();
    await sleep(300);
  }
  return failed;
}
const card = n => cardCache.get(key(n));

/* ---------- Darstellung ---------- */
function costHTML(cost){
  if(!cost) return "";
  return cost.split(" // ").map(part=>
    (part.match(/\{[^}]+\}/g)||[]).map(t=>{
      const s=t.slice(1,-1);
      return `<img class="ms" src="${SYM(s)}" alt="{${esc(s)}}" title="{${esc(s)}}" onerror="this.outerHTML='<span class=ms-txt>${esc(s)}</span>'">`;
    }).join("")
  ).join('<span class="ms-txt" style="border:0">//</span>');
}
function pipsHTML(ci){
  if(!ci||!ci.length) return `<span class="pips">${costHTML("{C}")}</span>`;
  return `<span class="pips">${COLORS.filter(c=>ci.includes(c)).map(c=>costHTML("{"+c+"}")).join("")}</span>`;
}
function imgFor(name, kind="normal"){
  const a=artChoice[artKey(name)]; const c=card(name);
  if(a&&a[kind]) return a[kind];
  return c&&c[kind] ? c[kind] : "";
}
const GROUPS=[
  ["Länder",t=>/\bLand\b/.test(t)&&!/Creature/.test(t)],
  ["Sagas",t=>/\bSaga\b/.test(t)],
  ["Kreaturen",t=>/Creature/.test(t)],
  ["Planeswalker",t=>/Planeswalker/.test(t)],
  ["Schlachten",t=>/Battle/.test(t)],
  ["Spontanzauber",t=>/Instant/.test(t)],
  ["Hexereien",t=>/Sorcery/.test(t)],
  ["Artefakte",t=>/Artifact/.test(t)],
  ["Verzauberungen",t=>/Enchantment/.test(t)]
];
const ORDER=["Kreaturen","Planeswalker","Sagas","Verzauberungen","Artefakte","Spontanzauber","Hexereien","Schlachten","Länder","Nicht gefunden"];
function groupOf(c){
  if(!c||c.missing) return "Nicht gefunden";
  for(const [g,f] of GROUPS) if(f(c.type_line)) return g;
  return "Verzauberungen";
}
function offColor(c, ci){ return c && !c.missing && c.color_identity.some(x=>!ci.includes(x)); }


/* ---------- Brackets & Game Changers ----------
   Game-Changers-Liste Stand Update 9. Februar 2026 (53 Karten).
   Neue Kartendaten von Scryfall bringen das Feld game_changer mit, das hat Vorrang. */
const GAME_CHANGERS=new Set(["Drannith Magistrate","Enlightened Tutor","Farewell","Humility","Serra's Sanctum","Smothering Tithe","Teferi's Protection",
"Consecrated Sphinx","Cyclonic Rift","Fierce Guardianship","Force of Will","Gifts Ungiven","Intuition","Mystical Tutor","Narset, Parter of Veils","Rhystic Study","Thassa's Oracle",
"Ad Nauseam","Bolas's Citadel","Braids, Cabal Minion","Demonic Tutor","Imperial Seal","Necropotence","Opposition Agent","Orcish Bowmasters","Tergrid, God of Fright","Vampiric Tutor",
"Gamble","Jeska's Will","Underworld Breach",
"Biorhythm","Crop Rotation","Gaea's Cradle","Natural Order","Seedborn Muse","Survival of the Fittest","Worldly Tutor",
"Aura Shards","Coalition Victory","Grand Arbiter Augustin IV","Notion Thief",
"Ancient Tomb","Chrome Mox","Field of the Dead","Glacial Chasm","Grim Monolith","Lion's Eye Diamond","Mana Vault","Mishra's Workshop","Mox Diamond","Panoptic Mirror","The One Ring","The Tabernacle at Pendrell Vale"].map(n=>n.toLowerCase()));
const BRACKETS={1:["Exhibition","Ultra-casual, Thema vor Stärke"],2:["Core","Precon-Niveau, keine Game Changers"],3:["Upgraded","Verbessert, höchstens 3 Game Changers"],4:["Optimized","Hohe Stärke, keine Grenzen"],5:["cEDH","Kompetitiv, auf Turnierniveau"]};
const GC_LIMIT={1:0,2:0,3:3,4:Infinity,5:Infinity};
function isGC(n){
  const c=card(n);
  if(c&&!c.missing&&typeof c.gc==="boolean") return c.gc;
  return GAME_CHANGERS.has(key(n))||!!(c&&c.name&&GAME_CHANGERS.has(key(c.name)));
}
function gcOf(deck){
  const names=[deck.commander,...parseList(deck.list).map(e=>e.name)];
  return [...new Set(names)].filter(isGC);
}
function powerOf(deck){
  const gc=gcOf(deck); const p=deck.power||{};
  const auto=gc.length===0?2:gc.length<=3?3:4;
  return {bracket:p.bracket||auto, pl:p.pl||null, gc, auto:!p.bracket,
    why:p.why||"Automatisch geschätzt, nur aus der Zahl der Game Changers. Kombos und Tempo sind darin nicht berücksichtigt."};
}
function powerHTML(deck){
  const p=powerOf(deck); const [bn]=BRACKETS[p.bracket];
  const over=p.gc.length>GC_LIMIT[p.bracket];
  return `<div class="power" aria-label="Stärke des Decks">
    <div class="pw-box" title="${esc(BRACKETS[p.bracket][1])}"><span class="pw-lbl">Bracket</span><b class="pw-num">${p.bracket}</b><small>${esc(bn)}${p.auto?" · geschätzt":""}</small></div>
    <div class="pw-box"><span class="pw-lbl">Powerlevel</span><b class="pw-num">${p.pl??"–"}<i>/10</i></b><div class="meter" aria-hidden="true"><span style="width:${(p.pl||0)*10}%"></span></div></div>
    <div class="pw-why"><p>${esc(p.why)}</p>
      <div class="gcs ${over?"over":""}"><span class="lbl">${p.gc.length?`${p.gc.length} Game Changer${p.gc.length>1?"s":""}`:"Keine Game Changers"}${over?" · zu viele für dieses Bracket":""}</span>
      ${p.gc.map(n=>`<button class="gc-tag" data-card="${esc(n)}">${esc((card(n)&&!card(n).missing)?card(n).name:n)}</button>`).join("")}</div>
    </div></div>`;
}
function openCompare(){
  const rows=allDecks().map(d=>({d,p:powerOf(d),c:card(d.commander)}))
    .sort((a,b)=>b.p.bracket-a.p.bracket||(b.p.pl||0)-(a.p.pl||0)||a.d.name.localeCompare(b.d.name));
  openModal(`<div class="cmp">
    <div class="cmp-head"><h3>Powerlevel-Vergleich</h3><span class="hint">${rows.length} Decks · stärkste zuerst · Klick öffnet das Deck</span></div>
    <div class="brk">${[1,2,3,4,5].map(i=>`<div><span class="bp b${i}">B${i}</span> <b>${BRACKETS[i][0]}</b>${esc(BRACKETS[i][1])}</div>`).join("")}</div>
    <div class="tbl"><table>
      <thead><tr><th>Deck</th><th class="hide-s">Farben</th><th>Bracket</th><th>Powerlevel</th><th class="hide-s">Game Changers</th></tr></thead>
      <tbody>${rows.map(({d,p,c})=>`<tr tabindex="0" data-id="${esc(d.id)}">
        <td><div class="dn"><span class="dot" style="background:${esc(d.accent||"#d6b46a")}"></span><span style="min-width:0"><b>${esc(d.name)}</b><small>${esc(deckLabel(d))}</small></span></div></td>
        <td class="hide-s">${c&&!c.missing?pipsHTML(c.color_identity):""}</td>
        <td><span class="bp b${p.bracket}" title="${esc(BRACKETS[p.bracket][0])}">B${p.bracket}</span></td>
        <td><div class="plbar"><span class="tr"><i style="width:${(p.pl||0)*10}%;background:${esc(d.accent||"#d6b46a")}"></i></span><b>${p.pl??"–"}</b></div></td>
        <td class="hide-s num">${p.gc.length}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="cmp-note">Das Bracket folgt dem offiziellen Commander-Bracket-System (Beta, Game-Changers-Liste vom Februar 2026). Das Powerlevel von 1 bis 10 ist eine Einschätzung und ersetzt das Gespräch vor dem Spiel nicht: Wie gut ein Deck läuft, hängt auch vom Tisch ab.</p>
  </div>`);
  sheet.querySelectorAll("tr[data-id]").forEach(tr=>{
    const go=()=>{closeModal();switchDeck(tr.dataset.id);};
    tr.onclick=go; tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
}

function renderTabs(){
  const el=document.getElementById("tabs");
  const decks=allDecks(); const cur=decks.find(d=>d.id===current)||decks[0];
  const idx=decks.indexOf(cur);
  const c=card(cur.commander);
  el.innerHTML=`
    <button class="step" id="prevDeck" aria-label="Vorheriges Deck" title="Vorheriges Deck">‹</button>
    <div class="dd">
      <button class="dd-btn" id="ddBtn" aria-haspopup="listbox" aria-expanded="${ddOpen}">
        ${c?pipsHTML(c.color_identity):""}
        <span class="dd-txt"><b>${esc(cur.name)}</b><small>${esc(deckLabel(cur))}</small></span>
        <span class="dd-count">${idx+1} / ${decks.length}</span>

  document.getElementById("ddBtn").onclick=e=>{e.stopPropagation();ddOpen=!ddOpen;ddFilter="";renderTabs();};
  document.getElementById("prevDeck").onclick=()=>switchDeck(decks[(idx-1+decks.length)%decks.length].id);
  document.getElementById("nextDeck").onclick=()=>switchDeck(decks[(idx+1)%decks.length].id);
  document.getElementById("addDeck").onclick=openImport;
  document.getElementById("cmpBtn").onclick=e=>{e.stopPropagation();ddOpen=false;openCompare();};
  if(ddOpen){
    const inp=document.getElementById("ddSearch");
    const list=document.getElementById("ddList");
    const fill=()=>{
      const q=ddFilter.toLowerCase().trim();
      const hits=decks.filter(d=>!q||d.name.toLowerCase().includes(q)||deckLabel(d).toLowerCase().includes(q));
      ddActive=Math.min(ddActive,Math.max(0,hits.length-1));
      list.innerHTML=hits.length?hits.map((d,i)=>{const cc=card(d.commander);
        return `<button class="dd-opt ${i===ddActive?"active":""}" role="option" aria-selected="${d.id===current}" data-id="${esc(d.id)}">
          <span class="dot" style="background:${esc(d.accent||"#d6b46a")}"></span>
          <span class="t"><b>${esc(d.name)}</b><small>${esc(deckLabel(d))}</small></span>
          ${cc?pipsHTML(cc.color_identity):""}<span class="dd-br">B${powerOf(d).bracket}${d.power&&d.power.pl?" · "+d.power.pl:""}</span></button>`}).join(""):`<p class="dd-empty">Kein Deck gefunden.</p>`;
      list.querySelectorAll(".dd-opt").forEach(b=>b.onclick=()=>switchDeck(b.dataset.id));
      const a=list.querySelector(".dd-opt.active"); if(a) a.scrollIntoView({block:"nearest"});
      return hits;
    };
    ddActive=Math.max(0,decks.indexOf(cur));
    let hits=fill();
    inp.focus();
    inp.oninput=()=>{ddFilter=inp.value;ddActive=0;hits=fill();};
    inp.onkeydown=e=>{
      if(e.key==="ArrowDown"){e.preventDefault();ddActive=Math.min(ddActive+1,hits.length-1);fill();}
      else if(e.key==="ArrowUp"){e.preventDefault();ddActive=Math.max(ddActive-1,0);fill();}
      else if(e.key==="Enter"){e.preventDefault();if(hits[ddActive])switchDeck(hits[ddActive].id);}
      else if(e.key==="Escape"){ddOpen=false;renderTabs();document.getElementById("ddBtn").focus();}
    };
    el.querySelector(".dd-panel").onclick=e=>e.stopPropagation();
  }
}

      grouped[g].map(e=>{const cl=e.c&&e.c.legal?e.c.legal.commander:null;const src=imgFor(e.name);
        return `<figure>${e.qty>1?`<span class="badge">${e.qty}×</span>`:""}${cl==="banned"?`<span class="badge ban">In Commander gebannt</span>`:""}${isGC(e.name)?`<span class="badge gc" title="Game Changer">GC</span>`:""}
        ${src?`<img loading="lazy" class="${offColor(e.c,ci)?"warn":""}" src="${esc(src)}" alt="${esc(e.name)}" title="${esc(e.name)}" data-card="${esc(e.name)}">`
             :`<button class="ph" data-card="${esc(e.name)}">${esc(e.name)}</button>`}</figure>`}).join("")).join("")}
  </div>`}
  ${deck.planned&&deck.planned.length?`
  <section class="planned"><h3>Noch geplante Tausche</h3>
    <div class="tbl"><table><thead><tr><th>Raus</th><th>Rein</th><th>Kosten</th><th>Farben ok?</th></tr></thead><tbody>
    ${deck.planned.map(p=>{const c=card(p.in);const bad=offColor(c,ci);
      return `<tr><td>${esc(p.out)}</td><td><button class="link" data-card="${esc(p.in)}">${esc(p.in)}</button></td><td>${c?costHTML(c.mana_cost):""}</td><td style="color:${c&&!c.missing?(bad?"var(--bad)":"var(--ok)"):"var(--muted)"}">${c&&!c.missing?(bad?"Nein":"Ja"):"–"}</td></tr>`}).join("")}
    </tbody></table></div></section>`:""}
  <p class="status" id="status"></p>`;
  const main=document.getElementById("deck"); main.innerHTML=html;

  main.querySelectorAll("[data-card]").forEach(el=>{
    el.addEventListener("click",()=>openCard(el.dataset.card));
    el.addEventListener("mouseenter",()=>{const pv=document.getElementById("pv");const s=imgFor(el.dataset.card);if(pv&&s)pv.src=s;});
    el.addEventListener("focus",()=>{const pv=document.getElementById("pv");const s=imgFor(el.dataset.card);if(pv&&s)pv.src=s;});
  });
  const sz=document.getElementById("cardSize");
  if(sz) sz.oninput=()=>{cardSize=+sz.value;store.set("mtg-size",cardSize);const g=main.querySelector(".grid");if(g)g.style.setProperty("--card",cardSize+"px");};
  main.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{viewMode=b.dataset.view;store.set("mtg-view-v2",viewMode);render()});
  const del=document.getElementById("delDeck");
  if(del) del.onclick=()=>confirmDelete(deck);
  const ex=document.getElementById("exportBtn");
  if(ex) ex.onclick=()=>openExport(deck);
}

/* ---------- Dialoge ---------- */
const modal=document.getElementById("modal"), sheet=document.getElementById("sheet");
function openModal(html){sheet.innerHTML=`<button class="close" aria-label="Schliessen">×</button>`+html;modal.hidden=false;sheet.querySelector(".close").onclick=closeModal;}
function closeModal(){modal.hidden=true;sheet.innerHTML="";}
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()});

async function openCard(name){
  const c=card(name);
  if(!c||c.missing){openModal(`<h3>${esc(name)}</h3><p>Diese Karte wurde auf Scryfall nicht gefunden.</p>`);return;}
  const deck=allDecks().find(d=>d.id===current); const cmd=card(deck.commander)||{color_identity:[]};
  const bad=offColor(c,cmd.color_identity);
  openModal(`<div class="detail">
    <div><img class="big" id="bigImg" src="${esc(imgFor(name))}" alt="${esc(c.name)}">
      ${c.back?`<button class="btn" id="flip" style="margin-top:8px">Rückseite zeigen</button>`:""}</div>
    <div style="min-width:0">
      <h3>${esc(c.name)}</h3>
      <p class="cmd-type">${costHTML(c.mana_cost)} &nbsp;${esc(c.full_type)}</p>
      <p class="chip ${bad?"bad":"ok"}" style="display:inline-flex">Farbidentität ${pipsHTML(c.color_identity)} ${bad?"<b>passt nicht zum Commander</b>":"<b>✓</b> passt"}</p>
      <p class="oracle" style="margin-top:12px">${esc(c.oracle)}</p>
      <h4 style="font:700 1.05rem var(--f-display);margin:18px 0 6px">Legalität in den Spielmodi</h4>
      ${legalHTML(c)}
      <p style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn primary" href="https://www.cardmarket.com/de/Magic/Products/Search?searchString=${encodeURIComponent(c.front)}" target="_blank" rel="noopener">Alle Versionen auf Cardmarket</a>
        <a class="btn" href="${esc(c.uri||`https://scryfall.com/card/${c.set}/${c.cn}`)}" target="_blank" rel="noopener">Auf Scryfall öffnen</a>
        ${artChoice[artKey(name)]?`<button class="btn" id="resetArt">Standard-Artwork</button>`:""}</p>
      <h4 style="font:700 1.05rem var(--f-display);margin:18px 0 0">Artwork wählen</h4>
      <div class="arts" id="arts"><p class="hint">Lade alle Artworks…</p></div>
    </div></div>`);
  let showingBack=false;
  const flip=document.getElementById("flip");
  if(flip) flip.onclick=()=>{showingBack=!showingBack;document.getElementById("bigImg").src=showingBack?c.back:imgFor(name);flip.textContent=showingBack?"Vorderseite zeigen":"Rückseite zeigen";};
  const rs=document.getElementById("resetArt");
  if(rs) rs.onclick=()=>{delete artChoice[artKey(name)];store.set("mtg-art",artChoice);render();openCard(name);};
  try{
    let url=`${API}/cards/search?q=${encodeURIComponent(`oracleid:${c.oracle_id}`)}&unique=art&order=released&include_extras=true`;
    const prints=[];
    while(url&&prints.length<120){const r=await fetch(url);const j=await r.json();prints.push(...(j.data||[]));url=j.has_more?j.next_page:null;if(url)await sleep(110);}
    const chosen=artChoice[artKey(name)];
    const arts=document.getElementById("arts"); if(!arts) return;
    arts.innerHTML=prints.map((p,i)=>{
      const im=p.image_uris||(p.card_faces&&p.card_faces[0].image_uris)||{};
      if(!im.normal) return "";
      const on=chosen?(chosen.set===p.set&&chosen.cn===p.collector_number):(p.set===c.set&&p.collector_number===c.cn);
      return `<button aria-pressed="${on}" data-i="${i}"><img loading="lazy" src="${esc(im.small||im.normal)}" alt="${esc(p.set_name)}"><span>${esc(p.set.toUpperCase())} · ${esc(p.artist||"")}</span></button>`;
    }).join("") || `<p class="hint">Keine weiteren Artworks gefunden.</p>`;
    arts.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
      const p=prints[+b.dataset.i]; const im=p.image_uris||p.card_faces[0].image_uris;
      artChoice[artKey(name)]={normal:im.normal,art_crop:im.art_crop,set:p.set,cn:p.collector_number};
      store.set("mtg-art",artChoice);
      arts.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      document.getElementById("bigImg").src=im.normal;
      render();
    });
  }catch(e){const a=document.getElementById("arts");if(a)a.innerHTML=`<p class="hint">Artworks konnten nicht geladen werden. Bist du online?</p>`;}
}

function openImport(){
  openModal(`<h3 style="font:800 1.5rem var(--f-display);margin:0 0 4px">Deck hinzufügen</h3>
    <p class="hint">Füge einen Export aus Arena, Moxfield oder Archidekt ein. Das Deck wird nur in diesem Browser gespeichert.</p>
    <form id="impForm">
      <label for="impName">Deckname</label><input type="text" id="impName" required placeholder="z. B. Friedhof-Deck">
      <label for="impCmd">Commander</label><input type="text" id="impCmd" placeholder="Leer lassen, wenn die Liste einen Commander-Abschnitt hat">
      <label for="impList">Deckliste</label><textarea id="impList" required placeholder="Commander&#10;1 Muldrotha, the Gravetide&#10;&#10;Deck&#10;1 Sol Ring&#10;..."></textarea>
      <p id="impErr" class="hint" style="color:var(--bad)"></p>
      <p style="display:flex;gap:8px"><button class="btn primary" type="submit">Deck anlegen</button><button class="btn" type="button" id="impCancel">Abbrechen</button></p>
    </form>`);
  document.getElementById("impCancel").onclick=closeModal;
  document.getElementById("impForm").onsubmit=async ev=>{
    ev.preventDefault();
    const name=document.getElementById("impName").value.trim();
    let cmd=document.getElementById("impCmd").value.trim();
    let raw=document.getElementById("impList").value;
    const sec=raw.match(/^\s*Commander\s*\n\s*(\d+)\s+(.+?)(?:\s+\([A-Za-z0-9]+\)\s*[\w-]*)?\s*$/mi);
    if(!cmd&&sec) cmd=sec[2].trim();
    if(!cmd){document.getElementById("impErr").textContent="Bitte gib den Commander an.";return;}
    const d={id:"c"+Date.now(),name,commander:cmd,list:raw,custom:true,planned:[],accent:"#d6b46a",note:"Eigenes importiertes Deck."};
    customDecks.push(d);store.set("mtg-custom",customDecks);current=d.id;store.set("mtg-tab",current);
    closeModal(); await load();
  };
}
function confirmDelete(deck){
  openModal(`<h3 style="font:800 1.4rem var(--f-display);margin:0 0 8px">${esc(deck.name)} entfernen?</h3>
    <p>Das Deck wird aus diesem Browser gelöscht.</p>
    <p style="display:flex;gap:8px"><button class="btn danger" id="yes">Entfernen</button><button class="btn" id="no">Behalten</button></p>`);
  document.getElementById("no").onclick=closeModal;
  document.getElementById("yes").onclick=()=>{customDecks=customDecks.filter(d=>d.id!==deck.id);store.set("mtg-custom",customDecks);current=DECKS[0].id;closeModal();render();};
}

/* ---------- Export ---------- */
function printing(name){
  const a=artChoice[artKey(name)]; const c=card(name);
  if(a&&a.set) return {set:a.set,cn:a.cn};
  if(c&&!c.missing&&c.set) return {set:c.set,cn:c.cn};
  return null;
}
function buildExport(deck,opt){
  const isLand=n=>groupOf(card(n))==="Länder";
  const line=(q,n)=>{
    const c=card(n); const nm=(c&&!c.missing)?c.name:n; const p=printing(n);
    let s=`${q} ${nm}`;
    if(opt.set&&p){ s+=` (${p.set.toUpperCase()})`; if(opt.cn) s+=` ${p.cn}`; }
    return s;
  };
  let entries;
  if(opt.scope==="planned") entries=(deck.planned||[]).map(p=>({qty:1,name:p.in}));
  else entries=parseList(deck.list).filter(e=>key(e.name)!==key(deck.commander));
  if(opt.scope==="lands") entries=entries.filter(e=>isLand(e.name));
  if(opt.scope==="nonlands") entries=entries.filter(e=>!isLand(e.name));
  if(opt.basics===false) entries=entries.filter(e=>!/^(Plains|Island|Swamp|Mountain|Forest|Wastes)$/i.test(e.name));
  const body=entries.map(e=>line(e.qty,e.name));
  const withCmd=opt.scope==="all"||opt.scope==="nonlands";
  if(withCmd&&opt.sections) return ["Commander",line(1,deck.commander),"","Deck",...body].join("\n");
  if(withCmd) return [line(1,deck.commander),...body].join("\n");
  return body.join("\n");
}
async function openExport(deck){
  const hasPlanned=deck.planned&&deck.planned.length;
  openModal(`<h3 style="font:800 1.5rem var(--f-display);margin:0 0 4px">Liste exportieren · ${esc(deck.name)}</h3>
    <p class="hint">Bei jeder Karte wird die Version mit dem Artwork verwendet, das du in diesem Deck gewählt hast. Sonst die Standardversion von Scryfall.</p>
    <div class="exp-opts">
      <label for="expScope">Umfang
        <select id="expScope">
          <option value="all">Ganzes Deck mit Commander</option>
          <option value="nonlands">Ohne Länder</option>
          <option value="lands">Nur Länder</option>
          ${hasPlanned?`<option value="planned">Geplante Tausche (Rein)</option>`:""}
        </select></label>
      <label for="expSet"><input type="checkbox" id="expSet" checked> Setcode</label>
      <label for="expCn"><input type="checkbox" id="expCn" checked> Sammlernummer</label>
      <label for="expBasics"><input type="checkbox" id="expBasics" checked> Standardländer</label>
      <label for="expSec"><input type="checkbox" id="expSec"> Abschnitte «Commander / Deck» (Arena)</label>
    </div>
    <textarea id="expOut" readonly aria-label="Exportierte Liste">Lade Kartendaten…</textarea>
    <p class="hint" id="expInfo"></p>
    <p style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="expCopy">Kopieren</button>
      <button class="btn" id="expSave">Als .txt speichern</button>
    </p>`);
  const $=id=>document.getElementById(id);
  const opts=()=>({scope:$("expScope").value,set:$("expSet").checked,cn:$("expCn").checked,basics:$("expBasics").checked,sections:$("expSec").checked});
  const update=()=>{
    if(!$("expOut")) return;
    $("expCn").disabled=!$("expSet").checked;
    const t=buildExport(deck,opts());
    $("expOut").value=t;
    const n=t.split("\n").filter(l=>/^\d+\s/.test(l)).reduce((s,l)=>s+parseInt(l),0);
    $("expInfo").textContent=`${n} Karten in der Liste.`;
  };
  ["expScope","expSet","expCn","expBasics","expSec"].forEach(id=>$(id).onchange=update);
  $("expCopy").onclick=async()=>{
    const ta=$("expOut");
    try{await navigator.clipboard.writeText(ta.value);$("expCopy").textContent="Kopiert";}
    catch(e){ta.focus();ta.select();try{document.execCommand("copy");$("expCopy").textContent="Kopiert";}catch(_){$("expInfo").textContent="Text ist markiert. Kopiere ihn mit Strg+C.";}}
    setTimeout(()=>{const b=$("expCopy");if(b)b.textContent="Kopieren";},1800);
  };
  $("expSave").onclick=()=>{
    const blob=new Blob([$("expOut").value],{type:"text/plain"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`${deck.name.replace(/[^\w\-äöüÄÖÜ ]/g,"")} - ${$("expScope").selectedOptions[0].text}.txt`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  // Fehlende Kartendaten nachladen, damit Länder und Setcodes stimmen
  const names=[deck.commander,...parseList(deck.list).map(e=>e.name),...(deck.planned||[]).map(p=>p.in)];
  if(names.some(n=>!card(n))){
    try{await fetchCards(names,(a,b)=>{const o=$("expOut");if(o)o.value=`Lade Kartendaten… ${a} / ${b}`;});}
    catch(e){const i=$("expInfo");if(i)i.textContent="Scryfall ist nicht erreichbar. Setcodes und die Länder-Filter fehlen deshalb teilweise.";}
  }
  update();
}

/* ---------- Start ---------- */
function migrateArt(){
  const old=Object.keys(artChoice).filter(k=>!k.includes("|"));
  if(!old.length) return;
  for(const k of old){
    for(const d of allDecks()){
      const has=key(d.commander)===k||parseList(d.list).some(e=>key(e.name)===k)||(d.planned||[]).some(p=>key(p.in)===k);
      if(has&&!artChoice[d.id+"|"+k]) artChoice[d.id+"|"+k]=artChoice[k];
    }
    delete artChoice[k];
  }
  store.set("mtg-art",artChoice);
}
async function load(){
  migrateArt();
  const decks=allDecks(); const cur=decks.find(d=>d.id===current)||decks[0];
  const namesOf=d=>[d.commander,...parseList(d.list).map(e=>e.name),...(d.planned||[]).flatMap(p=>[p.in,p.out])];
  const names=[...namesOf(cur),...decks.filter(d=>d!==cur).flatMap(namesOf)];
  render();
  const st=()=>document.getElementById("status");
  let last=0;
  const failed=await fetchCards(names,
    (a,b)=>{const s=st();if(s)s.textContent=`Lade Karten von Scryfall… ${a} / ${b}`;},
    ()=>{ if(modal.hidden&&!ddOpen&&Date.now()-last>1500){last=Date.now();render();} });
  if(modal.hidden&&!ddOpen) render();
  const s=st();
  if(s) s.textContent=failed?`${failed} Karten konnten gerade nicht von Scryfall geladen werden. Lade die Seite in einer Minute neu.`:"";
}
load();
</script>
